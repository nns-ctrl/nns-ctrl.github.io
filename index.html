<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOSH YOU ARE TUFF</title>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 2rem 1rem;
    }

    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,200,0,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,200,0,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 8s linear infinite;
      z-index: 0;
    }

    @keyframes gridMove {
      from { transform: translateY(0); }
      to   { transform: translateY(40px); }
    }

    /* Scanline overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.15) 2px,
        rgba(0,0,0,0.15) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    .wrapper {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      width: 100%;
      max-width: 700px;
    }

    /* ── Main title ── */
    .title-wrap {
      text-align: center;
      position: relative;
    }

    .pre-title {
      font-size: 0.8rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: #ffc200;
      opacity: 0;
      animation: fadeIn 0.6s 0.3s forwards;
    }

    .main-title {
      font-family: 'Black Ops One', sans-serif;
      font-size: clamp(3.5rem, 14vw, 8rem);
      line-height: 0.95;
      text-transform: uppercase;
      position: relative;
      opacity: 0;
      animation: titleDrop 0.8s 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    /* Chrome text effect */
    .main-title span {
      display: block;
    }
    .main-title .word-josh {
      color: #fff;
      text-shadow:
        0 0 20px rgba(255,255,255,0.8),
        0 0 60px rgba(255,255,255,0.4),
        4px 4px 0px #333;
    }
    .main-title .word-tuff {
      color: #ffc200;
      text-shadow:
        0 0 20px rgba(255,194,0,0.9),
        0 0 60px rgba(255,194,0,0.5),
        4px 4px 0px #7a5c00;
      animation: tuffPulse 2s ease-in-out infinite;
    }

    @keyframes tuffPulse {
      0%, 100% { text-shadow: 0 0 20px rgba(255,194,0,0.9), 0 0 60px rgba(255,194,0,0.5), 4px 4px 0 #7a5c00; }
      50%       { text-shadow: 0 0 40px rgba(255,194,0,1),   0 0 100px rgba(255,194,0,0.8), 4px 4px 0 #7a5c00; }
    }

    .subtitle {
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #888;
      margin-top: 0.5rem;
      opacity: 0;
      animation: fadeIn 0.6s 1s forwards;
    }

    /* ── Divider ── */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #ffc200, transparent);
      opacity: 0;
      animation: fadeIn 0.6s 1.1s forwards;
    }

    /* ── Video ── */
    .video-wrap {
      width: 100%;
      max-width: 500px;
      border: 2px solid #ffc200;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(255,194,0,0.3), 0 0 80px rgba(255,194,0,0.1);
      opacity: 0;
      animation: fadeIn 0.8s 1.3s forwards;
      position: relative;
    }

    .video-wrap::before {
      content: 'EXHIBIT A';
      position: absolute;
      top: 10px; left: 12px;
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      color: #ffc200;
      z-index: 3;
      font-family: 'Black Ops One', sans-serif;
    }

    .video-wrap iframe {
      width: 100%;
      aspect-ratio: 16/9;
      display: block;
      border: none;
    }

    /* ── Discord button ── */
    .discord-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: transparent;
      border: 2px solid #ffc200;
      color: #ffc200;
      font-family: 'Black Ops One', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      text-decoration: none;
      padding: 0.85rem 2.5rem;
      border-radius: 3px;
      position: relative;
      overflow: hidden;
      transition: color 0.3s;
      opacity: 0;
      animation: fadeIn 0.6s 1.6s forwards;
    }

    .discord-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #ffc200;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 0;
    }

    .discord-btn:hover::before { transform: translateX(0); }
    .discord-btn:hover { color: #000; }

    .discord-btn svg, .discord-btn span { position: relative; z-index: 1; }

    /* ── Keyframes ── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes titleDrop {
      from { opacity: 0; transform: translateY(-40px) scale(1.1); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* corner decorations */
    .corner {
      position: fixed;
      width: 60px; height: 60px;
      opacity: 0.3;
    }
    .corner-tl { top: 16px; left: 16px; border-top: 2px solid #ffc200; border-left: 2px solid #ffc200; }
    .corner-tr { top: 16px; right: 16px; border-top: 2px solid #ffc200; border-right: 2px solid #ffc200; }
    .corner-bl { bottom: 16px; left: 16px; border-bottom: 2px solid #ffc200; border-left: 2px solid #ffc200; }
    .corner-br { bottom: 16px; right: 16px; border-bottom: 2px solid #ffc200; border-right: 2px solid #ffc200; }
  </style>
</head>
<body>

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>

  <div class="wrapper">

    <div class="title-wrap">
      <p class="pre-title">official declaration</p>
      <h1 class="main-title">
        <span class="word-josh">JOSH</span>

      </svg>
      <span>JOIN THE TUFF GANG</span>
    </a>

  </div>

</body>
</html>
